# ─────────────────────────────────────────────────────────────────────────────
# Informe mensual de votaciones del Congreso.
#
# El día 3 de cada mes descarga las votaciones del mes anterior del portal de datos
# abiertos del Congreso, vuelve a pedir los días que quedaron pendientes en los tres
# meses anteriores (el Congreso publica con retraso), regenera los informes de los meses
# tocados y lo guarda todo en el repositorio con un commit del bot.
#
#   1. sondear:  una petición para saber si el portal responde desde el runner de GitHub
#   2. mensual:  descarga, normaliza y escribe data/ y reports/
#   3. commit:   solo si cambió algo
#
# Se puede lanzar a mano (pestaña Actions → «Informe mensual» → Run workflow) con un mes
# concreto, por ejemplo para rehacer uno.
# ─────────────────────────────────────────────────────────────────────────────
name: Informe mensual

on:
  schedule:
    - cron: "0 7 3 * *"          # día 3 de cada mes, 07:00 UTC (08:00/09:00 en Madrid)
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes AAAA-MM (vacío = mes anterior)"
        required: false
        default: ""

permissions:
  contents: write                # para hacer commit de data/ y reports/

concurrency:
  group: informe-mensual
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar que el portal del Congreso responde
        run: python -m src.votaciones sondear

      - name: Descargar votaciones y generar informes
        env:
          MES: ${{ inputs.mes }}   # por variable de entorno, nunca interpolado en el script
        run: |
          if [ -n "$MES" ]; then
            python -m src.votaciones mensual --mes "$MES"
          else
            python -m src.votaciones mensual
          fi

      - name: Guardar datos e informes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "datos: votaciones e informes ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
